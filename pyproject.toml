[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vis-workflow"
version = "0.1.0"
description = "Visualise bioimage workflow descriptors (Bilayers, BIAFLOWS, biomero-schema) as Mermaid diagrams"
authors = [{name = "Joost de Folter"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "biomero-schema @ git+https://github.com/NL-BioImaging/biomero-schema",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
browser = ["playwright>=1.40"]

[project.scripts]
vis-workflow = "vis_workflow.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
